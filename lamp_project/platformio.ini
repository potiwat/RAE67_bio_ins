[platformio]
default_envs = lamp

; Lamp_Robot main program (src/lamp_main.cpp)
; Upload: pio run -e lamp -t upload    Monitor: pio device monitor -e lamp
; (test programs servo_test / tof_test / cam_test moved to ~/Documents/Lamp_Archive/src_tests 2026-11-12)
[env:lamp]
platform = espressif32
board = node32s
framework = arduino
monitor_speed = 115200
lib_deps =
    ftservo/FTServo@^2.0.0
    madhephaestus/ESP32Servo@^3.0.6
    pololu/VL53L0X@^1.3.1
    adafruit/Adafruit NeoPixel@^1.12.0
monitor_echo = yes
monitor_filters = send_on_enter
monitor_eol = LF
build_src_filter = -<*> +<lamp_main.cpp> +<brain.cpp> +<motors.cpp> +<sensors.cpp> +<experiment.cpp>
